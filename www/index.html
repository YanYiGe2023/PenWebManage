<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>词典笔WEB管理</title>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: monospace;
            background: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 160px;
            background: #16213e;
            border-right: 1px solid #0f3460;
            padding: 16px 0;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        .sidebar .logo {
            padding: 0 16px 16px;
            font-size: 1em;
            color: #00d9ff;
            border-bottom: 1px solid #0f3460;
            margin-bottom: 12px;
        }
        .nav-item {
            padding: 12px 16px;
            cursor: pointer;
            color: #aaa;
            font-size: 0.9em;
            transition: background 0.15s, color 0.15s;
            border-left: 3px solid transparent;
            user-select: none;
        }
        .nav-item:hover {
            background: #1f2a4a;
            color: #e0e0e0;
        }
        .nav-item.active {
            background: #1f2a4a;
            color: #00d9ff;
            border-left-color: #00d9ff;
        }
        .content {
            flex: 1;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #1a1a2e;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">📖 词典笔</div>
        <div class="nav-item active" data-src="/pages/status">系统状态</div>
        <div class="nav-item" data-src="/pages/files">文件管理</div>
        <div class="nav-item" data-src="/pages/tools">工具</div>
    </div>
    <div class="content">
        <iframe id="mainFrame" src="/pages/status"></iframe>
    </div>

<script>
const frame = document.getElementById('mainFrame');
const items = document.querySelectorAll('.nav-item');

items.forEach(item => {
    item.addEventListener('click', () => {
        items.forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        frame.src = item.dataset.src;
    });
});
</script>
</body>
</html>
