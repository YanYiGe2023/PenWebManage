<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>工具</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="page">
    <div class="toolbar">
        <h2>📚 扫描历史</h2>
        <div>
            <span class="updated-at" id="updatedAt"></span>
            <button class="btn-refresh" id="refreshBtn">🔄 刷新</button>
        </div>
    </div>

    <div id="loading" class="loading">加载中...</div>
    <div id="error" class="error-banner" style="display:none;"></div>

    <div id="main" style="display:none;">
        <div class="tabs">
            <div class="tab active" data-lang="en">
                英语<span class="badge" id="countEn">0</span>
            </div>
            <div class="tab" data-lang="cn">
                中文<span class="badge" id="countCn">0</span>
            </div>
        </div>
        <ul class="word-list" id="wordList"></ul>
    </div>
</div>

<script>
let historyData = null;
let currentLang = "en";

function fmtTime(ms) {
    if (!ms) return "";
    const d = new Date(ms);
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ` +
           `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function nowStr() {
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function escapeHtml(s) {
    return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

function renderList() {
    const list = document.getElementById("wordList");
    const items = historyData[currentLang] || [];

    if (items.length === 0) {
        list.innerHTML = '<div class="empty">暂无记录</div>';
        return;
    }

    const sorted = [...items].sort((a, b) => (b.time || 0) - (a.time || 0));

    list.innerHTML = sorted.map(item => {
        const star = item.highFrequency ? '<span class="star">★</span>' : "";
        const word = escapeHtml(item.word || "");
        const content = escapeHtml(item.content || "");
        const time = fmtTime(item.time);
        return `
            <li class="word-item">
                <div class="head">
                    <span class="word">${word}${star}</span>
                    <span class="time">${time}</span>
                </div>
                <div class="content">${content}</div>
            </li>
        `;
    }).join("");
}

function switchLang(lang) {
    currentLang = lang;
    document.querySelectorAll(".tab").forEach(t => {
        t.classList.toggle("active", t.dataset.lang === lang);
    });
    if (historyData) renderList();
}

// ========== 拉取数据（只请求 API，不刷新页面）==========

async function refresh() {
    const btn = document.getElementById("refreshBtn");
    const loading = document.getElementById("loading");
    const errorEl = document.getElementById("error");
    const main = document.getElementById("main");
    const updatedAt = document.getElementById("updatedAt");

    btn.disabled = true;
    const oldText = btn.textContent;
    btn.textContent = "刷新中...";
    updatedAt.style.color = "#666";

    // 首次加载显示 loading；后续刷新不闪 loading，避免闪烁
    if (!historyData) {
        loading.style.display = "block";
    }
    errorEl.style.display = "none";

    try {
        const res = await fetch("/api/scan-history");
        const data = await res.json();

        loading.style.display = "none";

        if (!data.supported) {
            errorEl.style.display = "block";
            errorEl.innerHTML =
                `⚠️ ${escapeHtml(data.msg || "当前设备不支持此功能")}` +
                (data.path ? `<code>${escapeHtml(data.path)}</code>` : "");
            main.style.display = "none";
            historyData = null;
            updatedAt.textContent = "刷新失败";
            updatedAt.style.color = "#ff5555";
            return;
        }

        historyData = data;
        document.getElementById("countEn").textContent = data.count.en;
        document.getElementById("countCn").textContent = data.count.cn;
        main.style.display = "block";
        renderList();

        updatedAt.textContent = "更新于 " + nowStr();

    } catch (e) {
        loading.style.display = "none";
        errorEl.style.display = "block";
        errorEl.textContent = "加载失败: " + e.message;
        main.style.display = "none";
        updatedAt.textContent = "刷新失败";
        updatedAt.style.color = "#ff5555";
    } finally {
        btn.disabled = false;
        btn.textContent = oldText;
    }
}

document.getElementById("refreshBtn").addEventListener("click", refresh);

document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => switchLang(tab.dataset.lang));
});

// 页面打开时拉一次
refresh();
</script>

</body>
</html>
